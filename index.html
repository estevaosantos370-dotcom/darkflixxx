 8px}.detail-layout{display:grid;grid-template-columns:minmax(140px,230px) 1fr;gap:20px;margin:18px 0}.detail-poster{height:300px;background:#242424 center/cover;border-radius:5px;display:grid;place-items:center;text-align:center}.episode-list{display:grid;gap:8px;margin-top:13px}.episode{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px;background:#222;border-radius:4px}.episode button{white-space:nowrap}.video-wrap{background:#000}.video-wrap video{width:100%;max-height:69vh;display:block;background:#000}.player-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.account-pill{font-size:12px;color:#bbb;max-width:115px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}footer{padding:23px 4%;border-top:1px solid #222;color:#777;font-size:12px;margin-top:18px}@media(max-width:850px){header{height:auto;min-height:64px;flex-wrap:wrap;padding:10px 4%;gap:10px}.nav{order:3;width:100%;overflow:auto}.right{margin-left:auto}.grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:9px}.poster{height:195px}.hero{min-height:290px}.detail-layout{grid-template-columns:120px 1fr}.detail-poster{height:190px}}@media(max-width:510px){.search{width:115px}.right{gap:5px}.right button{padding:8px}.account-pill{display:none}.detail-layout{grid-template-columns:1fr}.detail-poster{height:230px;width:160px}.profile-screen h1{font-size:29px}}
</style><script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script></head><body>
<section id="profileScreen" class="profile-screen hidden"><div><h1>Quem está assistindo?</h1><div id="profiles" class="profiles"></div><div class="toolbar" style="justify-content:center"><button class="outline" onclick="addProfile()">＋ Adicionar perfil</button><button class="outline" onclick="returnToApp()">Voltar ao player</button></div></div></section>
<div id="app" class="hidden"><header><div class="logo" onclick="setPage('inicio')">DARK FLIX</div><nav class="nav"><button data-p="inicio" onclick="setPage('inicio')">Início</button><button data-p="filmes" onclick="setPage('filmes')">Filmes</button><button data-p="series" onclick="setPage('series')">Séries</button><button data-p="canais" onclick="setPage('canais')">Canais</button><button data-p="favoritos" onclick="setPage('favoritos')">Minha lista</button><button data-p="recentes" onclick="setPage('recentes')">Continuar assistindo</button></nav><div class="right"><input id="search" class="search" placeholder="Buscar títulos" oninput="searchChanged()"><span id="accountPill" class="account-pill"></span><button class="outline" title="Perfis" onclick="showProfiles()">👤</button><button class="outline" title="Conta" onclick="openSettings()">⚙</button><button class="outline" onclick="disconnect()">Sair</button></div></header><main id="main"></main><footer>Web player conectado ao catálogo do seu provedor. Perfis, favoritos e histórico ficam salvos localmente neste navegador.</footer></div>

<script>
const PROFILE_KEY='darkflix_profiles_v2',FAV_KEY='darkflix_favorites_v2',RECENT_KEY='darkflix_recent_v2';let profile=null,items=[],categories={filmes:[],series:[],canais:[]},page='inicio',selectedCategory='all',hls=null,loadSeq=0,seriesEpisodeCache={},loadedTypes={filmes:false,series:false,canais:false},pendingTypes={},visibleCount=30,scrollObserver=null;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function read(key,def){try{return JSON.parse(localStorage.getItem(key))??def}catch{return def}}function write(key,val){localStorage.setItem(key,JSON.stringify(val))}
async function responseJson(r,label){const text=await r.text();try{return JSON.parse(text)}catch{const sample=text.replace(/\s+/g,' ').slice(0,100);throw Error(`${label} respondeu conteúdo não JSON (HTTP ${r.status}): ${sample}`)}}async function api(action,extra={}){const params=new URLSearchParams({action,...Object.fromEntries(Object.entries(extra).map(([k,v])=>[k,String(v)]))});const r=await fetch(`/api/xtream?${params}`,{method:'GET',headers:{Accept:'application/json'},cache:'no-store'});const j=await responseJson(r,'/api/xtream');if(!r.ok)throw Error(j.error||'Falha ao consultar o provedor.');return j.data}
function getProfiles(){return read(PROFILE_KEY,[])}function showProfiles(){$('app').classList.add('hidden');$('profileScreen').classList.remove('hidden');let ps=getProfiles();if(!ps.length){ps=[{id:'p'+Date.now(),name:'Principal',avatar:'👤'}];write(PROFILE_KEY,ps)}$('profiles').innerHTML=ps.map(p=>`<div class="profile" onclick="selectProfile('${esc(p.id)}')"><div class="avatar">${esc(p.avatar||'👤')}</div><div class="pname">${esc(p.name)}</div><button class="outline" onclick="event.stopPropagation();removeProfile('${esc(p.id)}')">Editar/remover</button></div>`).join('')}function selectProfile(id){profile=getProfiles().find(p=>p.id===id);if(!profile)return;$('profileScreen').classList.add('hidden');$('app').classList.remove('hidden');$('accountPill').textContent=profile.name;setPage('inicio');loadCatalog()}function addProfile(){let ps=getProfiles();if(ps.length>=6)return alert('Limite de 6 perfis locais atingido.');let name=prompt('Nome do novo perfil:');if(name?.trim()){ps.push({id:'p'+Date.now(),name:name.trim(),avatar:['👤','🎬','⭐','🐼','🦊'][ps.length%5]});write(PROFILE_KEY,ps);showProfiles()}}function removeProfile(id){let ps=getProfiles(),p=ps.find(x=>x.id===id);if(!p)return;const name=prompt('Digite um novo nome para editar o perfil, ou deixe vazio para remover:',p.name);if(name===null)return;if(name.trim())p.name=name.trim();else{if(ps.length<=1)return alert('Mantenha pelo menos um perfil.');ps=ps.filter(x=>x.id!==id)}write(PROFILE_KEY,ps);showProfiles()}
const catalogActions={filmes:['get_vod_streams','get_vod_categories'],series:['get_series','get_series_categories'],canais:['get_live_streams','get_live_categories']};async function loadCatalog(type=pageType()||'filmes'){if(!type){const required=page==='favoritos'||page==='recentes'?['filmes','series','canais']:['filmes'];return Promise.all(required.map(t=>loadCatalog(t).catch(()=>null)))}if(loadedTypes[type]){render();return}if(pendingTypes[type])return pendingTypes[type];if(page==='inicio'&&type==='filmes'||pageType()===type)$('main').innerHTML='<div class="wrap loading">Carregando catálogo…</div>';pendingTypes[type]=(async()=>{const [list,cats]=await Promise.all(catalogActions[type].map(a=>api(a)));items=items.filter(x=>x.type!==type).concat(normalize(list,type));categories[type]=Array.isArray(cats)?cats:[];loadedTypes[type]=true;render()})().catch(e=>{if(page==='inicio'&&type==='filmes'||pageType()===type)showStatus(e.message,'err');throw e}).finally(()=>{delete pendingTypes[type]});return pendingTypes[type]}function normalize(list,type){return Array.isArray(list)?list.map(o=>({id:String(o.stream_id??o.series_id),name:o.name||o.title||'Sem título',type,year:o.year||o.releaseDate||'',genre:o.category_name||o.genre||'',categoryId:String(o.category_id??''),cover:o.stream_icon||o.cover||'',streamId:o.stream_id??o.series_id,ext:o.container_extension||(type==='canais'?'ts':'mp4'),plot:o.plot||'',rating:o.rating||''})).filter(o=>/^\d{1,20}$/.test(o.id)):[]}
function setPage(p){page=p;selectedCategory='all';visibleCount=30;$('search').value='';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('sel',b.dataset.p===p));const type=pageType();if(type&&!loadedTypes[type])loadCatalog(type).catch(()=>{});else if(!type&&(p==='favoritos'||p==='recentes'))loadCatalog(null).catch(()=>{});render()}function pageType(){return({filmes:'filmes',series:'series',canais:'canais'})[page]}function searchChanged(){visibleCount=30;const q=$('search').value.trim();if(q&&page==='inicio')Promise.all(['series','canais'].map(t=>loadedTypes[t]?Promise.resolve():loadCatalog(t).catch(()=>null)));render()}function render(){if($('app').classList.contains('hidden'))return;let q=$('search').value.trim().toLowerCase(),type=pageType();let list=items.filter(x=>{const match=!q||x.name.toLowerCase().includes(q)||String(x.genre).toLowerCase().includes(q);const typed=!type||x.type===type;const category=selectedCategory==='all'||x.categoryId===selectedCategory;const localList=page==='favoritos'?isFavorite(x):page==='recentes'?isRecent(x):true;return match&&typed&&category&&localList});let hero=page==='inicio'?`<section class="hero"><div><h1>Seu entretenimento.<br>Do seu jeito.</h1><p>Filmes, séries e canais carregados diretamente da sua conta.</p><button class="red" onclick="setPage('filmes')">▶ Explorar filmes</button> <button class="outline" onclick="setPage('canais')">Ver canais ao vivo</button></div></section>`:'';let title={inicio:'Catálogo',filmes:'Filmes',series:'Séries',canais:'Canais ao vivo',favoritos:'Minha lista',recentes:'Continuar assistindo'}[page];let tools=type?`<div class="toolbar"><label>Categoria <select id="categoryFilter" onchange="selectedCategory=this.value;visibleCount=30;render()"><option value="all">Todas</option>${categories[type].map(c=>`<option value="${esc(c.category_id)}" ${String(c.category_id)===selectedCategory?'selected':''}>${esc(c.category_name)}</option>`).join('')}</select></label><span class="muted">${list.length} título(s)</span></div>`:'';const shown=list.slice(0,visibleCount);$('main').innerHTML=hero+`<div class="wrap"><h2 class="section-title">${title}</h2>${tools}<div class="grid">${shown.map(card).join('')||'<p class="empty">Nenhum título nesta lista/categoria.</p>'}</div>${shown.length<list.length?'<div id="loadMoreSentinel" class="loading" style="text-align:center">Carregando mais títulos ao rolar…</div>':''}</div>`;observeMore()}function observeMore(){if(scrollObserver)scrollObserver.disconnect();const el=$('loadMoreSentinel');if(!el)return;if('IntersectionObserver'in window){scrollObserver=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting))loadMore()}, {rootMargin:'500px'});scrollObserver.observe(el)}else window.addEventListener('scroll',fallbackLoadMore,{passive:true})}function loadMore(){const el=$('loadMoreSentinel');if(!el)return;visibleCount+=30;render()}function fallbackLoadMore(){const el=$('loadMoreSentinel');if(el&&el.getBoundingClientRect().top<window.innerHeight+500){window.removeEventListener('scroll',fallbackLoadMore);loadMore()}}function card(x){return `<article class="card" onclick="details('${esc(x.id)}')"><div class="poster" style="${x.cover?`background-image:linear-gradient(0deg,#0008,transparent 60%),url('${esc(x.cover)}')`:''}"><i class="badge">${x.type==='canais'?'AO VIVO':x.type==='series'?'SÉRIE':'FILME'}</i>${isFavorite(x)?'<span class="favorite-mark">♥</span>':''}${x.cover?'':`<b>${esc(x.name)}</b>`}</div><div class="info"><strong>${esc(x.name)}</strong><span class="muted">${esc(x.genre)}${x.year?' · '+esc(x.year):''}</span></div></article>`}
function favKey(x){return`${profile.id}:${x.type}:${x.id}`}function isFavorite(x){return read(FAV_KEY,[]).includes(favKey(x))}function isRecent(x){return read(RECENT_KEY,[]).some(a=>a.profile===profile.id&&a.key===`${x.type}:${x.id}`)}function toggleFavorite(id){let x=items.find(a=>a.id===id);if(!x)return;let f=read(FAV_KEY,[]),k=favKey(x);write(FAV_KEY,f.includes(k)?f.filter(a=>a!==k):[...f,k]);details(id)}function addRecent(item){let r=read(RECENT_KEY,[]),key=`${item.type}:${item.id}`;r=r.filter(a=>!(a.profile===profile.id&&a.key===key));r.unshift({profile:profile.id,key,id:item.id,type:item.type,date:Date.now()});write(RECENT_KEY,r.slice(0,100))}
async function details(id){const x=items.find(a=>a.id===id);if(!x)return;open(`<div class="modalhead"><h2>${esc(x.name)}</h2><button class="close" onclick="closeModal()">×</button></div><div id="detailBody" class="loading">Carregando detalhes…</div>`);let extra={};try{if(x.type==='filmes')extra=await api('get_vod_info',{vod_id:x.id});else if(x.type==='series')extra=await api('get_series_info',{series_id:x.id})}catch(e){extra={_error:e.message}}if($('modal').classList.contains('hidden'))return;const data=extra.info||extra.movie_data||extra;let plot=x.plot||data.plot||data.description||'',cast=data.cast||'',director=data.director||'',released=data.releasedate||x.year,rating=data.rating||x.rating,poster=data.movie_image||data.cover||x.cover;$('detailBody').outerHTML=`<div class="detail-layout"><div class="detail-poster" style="${poster?`background-image:url('${esc(poster)}')`:''}">${poster?'':esc(x.name)}</div><div><div class="muted">${esc(x.type)} ${released?' · '+esc(released):''} ${rating?' · ★ '+esc(rating):''}</div><p>${esc(plot||'Sem sinopse disponível no provedor.')}</p>${director?`<p class="muted">Direção: ${esc(director)}</p>`:''}${cast?`<p class="muted">Elenco: ${esc(cast)}</p>`:''}<div class="toolbar"><button class="red" onclick="${x.type==='series'?`showEpisodes('${esc(x.id)}')`:`playItem('${esc(x.id)}')`}">${x.type==='series'?'▶ Ver episódios':'▶ Reproduzir'}</button><button onclick="toggleFavorite('${esc(x.id)}')">${isFavorite(x)?'♥ Remover dos favoritos':'＋ Minha lista'}</button></div><div id="episodeArea"></div>${extra._error?`<p class="muted">${esc(extra._error)}</p>`:''}</div></div>`}
async function showEpisodes(id){$('episodeArea').innerHTML='<div class="loading">Carregando temporadas e episódios…</div>';try{const d=await api('get_series_info',{series_id:id});const eps=d.episodes||{};let keys=Object.keys(eps);if(!keys.length)throw Error('O provedor não retornou episódios para esta série.');seriesEpisodeCache[id]=eps;let opts=keys.map(k=>`<option value="${esc(k)}">Temporada ${esc(k)}</option>`).join('');$('episodeArea').innerHTML=`<label class="field">Temporada<select id="seasonSelect" onchange="renderEpisodes('${esc(id)}')">${opts}</select></label><div id="episodeList"></div>`;renderEpisodes(id)}catch(e){$('episodeArea').innerHTML=`<div class="status err">${esc(e.message)}</div>`}}function renderEpisodes(id){const eps=seriesEpisodeCache[id]||{},key=$('seasonSelect')?.value||Object.keys(eps)[0],arr=eps[key]||[];$('episodeList').innerHTML=arr.map((ep,i)=>`<div class="episode"><span><b>${esc(ep.title||ep.name||'Episódio '+(i+1))}</b><br><span class="muted">${esc(ep.info?.plot||ep.plot||'')}</span></span><button class="red" onclick="playEpisode('${esc(id)}','${/^\d{1,20}$/.test(String(ep.id||ep.stream_id))?String(ep.id||ep.stream_id):''}','${/^[a-zA-Z0-9]{1,10}$/.test(String(ep.container_extension||'mp4'))?String(ep.container_extension||'mp4'):'mp4'}')">▶</button></div>`).join('')||'<p class="empty">Nenhum episódio nesta temporada.</p>'}
function playItem(id){const x=items.find(a=>a.id===id);if(!x)return;addRecent(x);const kind=x.type==='filmes'?'movie':'live',original=x.ext||(kind==='live'?'ts':'mp4'),formats=kind==='live'?['m3u8','ts','mp4']:['mp4',original,'m3u8'];const uniqueFormats=formats.filter((v,i,a)=>a.indexOf(v)===i);showPlayer(x.name,{kind,id:String(x.streamId),ext:uniqueFormats[0]},uniqueFormats)}function playEpisode(seriesId,episodeId,ext){if(!/^\d{1,20}$/.test(String(episodeId)))return alert('ID de episódio inválido.');const x=items.find(a=>a.id===seriesId);if(x)addRecent(x);const formats=['m3u8','mp4'];showPlayer('Reproduzindo episódio',{kind:'series',id:String(episodeId),ext:formats[0]},formats)}
let playerVariants=[],playerTried=new Set(),playerRequestId=0;
function showPlayer(title,spec,formats){
 playerVariants=formats.map(ext=>({...spec,ext}));playerTried=new Set();
 open(`<div class="modalhead"><h2>${esc(title)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="video-wrap"><video id="player" controls playsinline></video></div><div id="playerMsg" class="muted" role="status" aria-live="polite" style="margin-top:8px">Preparando stream…</div><div class="player-actions"><select id="playerVariant" onchange="startPlayer(this.value)" aria-label="Formato de reprodução" style="background:#222;color:white;border:1px solid #555;padding:9px;border-radius:4px">${playerVariants.map((v,i)=>`<option value="${i}">${i===0?'Preferido':v.ext.toUpperCase()}</option>`).join('')}</select><button class="outline" onclick="toggleFullscreen()">Tela cheia</button><button class="outline" onclick="retryPlayer()">Tentar novamente</button></div>`);

}
function fallbackVariant(reason){
 const next=playerVariants.findIndex((_,i)=>!playerTried.has(i));if(next<0)return false;
 const sel=$('playerVariant');if(sel)sel.value=String(next);
 $('playerMsg').textContent=`${reason} Tentando automaticamente ${playerVariants[next].ext.toUpperCase()}…`;
 startPlayer(String(next));return true
}
function mediaErrorLabel(video){
 const code=video?.error?.code;
 return ({1:'reprodução interrompida',2:'falha de rede',3:'o navegador não conseguiu decodificar o áudio/vídeo (codec ou dados inválidos)',4:'formato ou codec não suportado'})[code]||'erro de reprodução';
}
async function proxyDiagnostic(url){
 if(!url)return '';
 try{const target=new URL(url,location.href);if(target.origin!==location.origin)return '';const r=await fetch(target,{method:'GET',headers:{Accept:'*/*',Range:'bytes=0-0'},cache:'no-store'});const hint=r.headers.get('X-Stream-Error');if(hint){if(r.body)r.body.cancel().catch(()=>{});return hint}if(!r.ok){try{return (await responseJson(r,'Proxy de mídia')).error||`Proxy respondeu HTTP ${r.status}.`}catch(e){return e.message}}if(r.body)r.body.cancel().catch(()=>{});return ''}catch{return ''}
}
async function startPlayer(input){
 const idx=Number(input),spec=playerVariants[idx],v=$('player');if(!v||!spec)return;
 const requestId=++playerRequestId;playerTried.add(idx);
 if(hls){hls.destroy();hls=null}v.onerror=null;v.pause();v.removeAttribute('src');v.load();
 $('playerMsg').textContent=`Verificando ${spec.ext.toUpperCase()} no provedor…`;
 try{
  const ticketQuery=new URLSearchParams({kind:spec.kind,id:spec.id,ext:spec.ext});const r=await fetch(`/api/stream-ticket?${ticketQuery}`,{method:'GET',headers:{Accept:'application/json'},cache:'no-store'});
  const data=await responseJson(r,'/api/stream-ticket');if(!r.ok)throw Error(data.error||'Falha ao preparar stream.');if(requestId!==playerRequestId)return;
  const url=data.url;if(requestId!==playerRequestId)return;
  const isHls=spec.ext.toLowerCase()==='m3u8';
  if(isHls){
   if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=url;v.play().catch(()=>{$('playerMsg').textContent='Stream HLS conectado. Pressione reproduzir para iniciar.'})}
   else if(window.Hls&&Hls.isSupported()){
    let mediaRecoveries=0,networkRecoveries=0;
    hls=new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:10,maxMaxBufferLength:30,backBufferLength:30,manifestLoadingMaxRetry:4,manifestLoadingRetryDelay:500,manifestLoadingMaxRetryTimeout:8000,levelLoadingMaxRetry:5,levelLoadingRetryDelay:500,levelLoadingMaxRetryTimeout:10000,fragLoadingMaxRetry:5,fragLoadingRetryDelay:500,fragLoadingMaxRetryTimeout:10000});
    hls.on(Hls.Events.ERROR,(_,d)=>{
     if(!d.fatal)return;
     const details=d.details||'erro HLS',status=d.response?.code||d.networkDetails?.status||'',type=d.type||'erro';
     if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&mediaRecoveries<1){mediaRecoveries++;$('playerMsg').textContent=`Recuperando decodificador HLS após ${details}…`;hls.recoverMediaError();return}
     if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&networkRecoveries<2){networkRecoveries++;$('playerMsg').textContent=`Falha de rede HLS (${details}${status?`, HTTP ${status}`:''}); tentando reconectar (${networkRecoveries}/2)…`;setTimeout(()=>{if(requestId===playerRequestId&&hls)hls.startLoad(-1)},800*networkRecoveries);return}
     const reason=`HLS falhou: ${details}${status?` (HTTP ${status})`:''}.`;
     if(fallbackVariant(reason))return;
     $('playerMsg').textContent=`${reason} Todos os formatos alternativos foram tentados. ${type==='mediaError'?'O navegador recebeu mídia, mas não decodificou; codec/perfil de vídeo pode ser incompatível.':'Confira o diagnóstico do proxy ou a disponibilidade do stream.'}`;
     const failedUrl=d.response?.url||d.url||d.context?.url;
     proxyDiagnostic(failedUrl).then(msg=>{if(msg&&requestId===playerRequestId)$('playerMsg').textContent=`${reason} ${msg}`});
    });
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{if(requestId===playerRequestId)v.play().catch(()=>{$('playerMsg').textContent='Playlist HLS carregada. Pressione reproduzir para iniciar.'})});
    hls.on(Hls.Events.LEVEL_LOADED,()=>{if(requestId===playerRequestId)$('playerMsg').textContent='Playlist HLS carregada; aguardando segmentos de vídeo…'});
    hls.loadSource(url);hls.attachMedia(v)
   }else throw Error('Este navegador não tem suporte a HLS.js nem a HLS nativo.')
  }else{v.src=url;v.play().catch(()=>{$('playerMsg').textContent=`Stream ${spec.ext.toUpperCase()} conectado. Pressione reproduzir para iniciar.`})}
  v.onerror=()=>{
   const label=mediaErrorLabel(v),message=`${spec.ext.toUpperCase()}: ${label}.`;
   if(fallbackVariant(message))return;
   $('playerMsg').textContent=`${message} Todas as variantes foram tentadas. Se o proxy entregou os dados, o vídeo pode usar codec/perfil não suportado pelo navegador.`;
   proxyDiagnostic(url).then(reason=>{if(reason&&requestId===playerRequestId)$('playerMsg').textContent=`${message} ${reason}`})
  };
  if(requestId===playerRequestId)$('playerMsg').textContent=`Requisição GET pronta: navegador→Vercel em HTTPS; origem Xtream→proxy em HTTP (${spec.ext.toUpperCase()}).`
 }catch(e){if(requestId===playerRequestId)$('playerMsg').textContent=e.message;console.error('Falha na reprodução:',e)}
}
function retryPlayer(){playerTried=new Set();const sel=$('playerVariant');if(sel)startPlayer(sel.value)}
function toggleFullscreen(){const v=$('player');if(!v)return;if(document.fullscreenElement)document.exitFullscreen();else if(v.requestFullscreen)v.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()}
function open(html){$('modalContent').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){playerRequestId++;if(hls){hls.destroy();hls=null}const v=$('player');if(v){v.pause();v.removeAttribute('src');v.load()}$('modal').classList.add('hidden');$('modalContent').innerHTML=''}function showStatus(t,c){$('main').innerHTML=`<div class="wrap"><div class="status ${c||''}">${esc(t)}</div><button class="outline" onclick="loadCatalog()">Atualizar catálogo</button></div>`}function openSettings(){open(`<div class="modalhead"><h2>Player</h2><button class="close" onclick="closeModal()">×</button></div><p>O catálogo usa a conexão privada configurada no projeto Vercel. As credenciais não são enviadas ao navegador.</p><p>Perfil neste dispositivo: <b>${esc(profile?.name||'Principal')}</b>.</p><div class="toolbar"><button class="red" onclick="closeModal();loadCatalog()">Atualizar catálogo</button><button class="outline" onclick="closeModal();showProfiles()">Gerenciar perfis locais</button></div>`)}function returnToApp(){$('profileScreen').classList.add('hidden');$('app').classList.remove('hidden');if(!items.length)loadCatalog()}(function boot(){let ps=getProfiles();if(!ps.length){ps=[{id:'p'+Date.now(),name:'Principal',avatar:'👤'}];write(PROFILE_KEY,ps)}profile=ps[0];$('accountPill').textContent=profile.name;$('profileScreen').classList.add('hidden');$('app').classList.remove('hidden');setPage('inicio');loadCatalog('filmes').catch(()=>{})})();
