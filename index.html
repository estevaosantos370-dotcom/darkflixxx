<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0a"><title>Dark Flix — Web Player</title>
<style>
:root{--red:#e50914;--bg:#0a0a0a;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px/1.5 Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{border:0;border-radius:4px;padding:10px 14px;color:#fff;background:#333;cursor:pointer}button:hover{filter:brightness(1.2)}button:disabled{opacity:.5;cursor:wait}.red{background:var(--red)}.outline{background:transparent;border:1px solid #555}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.auth,.profile-screen{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 50% 12%,#351416,#080808 65%)}.box{width:min(440px,94vw);background:#151515;padding:32px;border:1px solid #292929;border-radius:8px}.box h1,.logo{color:var(--red);font-weight:900;letter-spacing:.4px}.box h1{font-size:34px;margin:0}.field{display:grid;gap:6px;margin:14px 0}.field input,.field select{padding:12px;background:#252525;border:1px solid #454545;color:white;border-radius:4px}.box>button{width:100%;margin-top:8px}.note{font-size:12px;color:#aaa;line-height:1.55}header{height:68px;background:#090909f2;position:sticky;top:0;z-index:6;display:flex;align-items:center;padding:0 4%;gap:25px;border-bottom:1px solid #222}.logo{font-size:24px;cursor:pointer}.nav{display:flex;gap:17px;align-items:center}.nav button{background:none;padding:7px 0;color:#c9c9c9;white-space:nowrap}.nav button.sel,.nav button:hover{color:#fff;font-weight:bold}.right{margin-left:auto;display:flex;gap:8px;align-items:center}.search{background:#222;border:1px solid #444;color:white;padding:9px;border-radius:4px;width:min(220px,25vw)}.hero{min-height:360px;padding:52px 5%;display:flex;align-items:end;background:linear-gradient(0deg,#0a0a0a,transparent 75%),radial-gradient(ellipse at 77% 28%,#5a191d,#251118 42%,#101010 75%);background-position:center;background-size:cover}.hero h1{font-size:clamp(35px,6vw,64px);line-height:1.02;margin:0 0 12px}.hero p{max-width:620px;color:#eee}.wrap{padding:0 4%;max-width:1500px;margin:auto}.section-title{margin:25px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;padding-bottom:27px}.card{background:#171717;border-radius:6px;overflow:hidden;cursor:pointer;transition:transform .16s,box-shadow .16s}.card:hover{transform:scale(1.035);box-shadow:0 8px 22px #000}.poster{height:232px;background:#252525 center/cover;display:grid;place-items:center;text-align:center;position:relative}.poster b{padding:18px;text-shadow:0 2px 6px #000}.badge{position:absolute;top:8px;left:8px;background:#000b;padding:4px 6px;border-radius:3px;font-size:10px}.favorite-mark{position:absolute;top:7px;right:8px;color:#fff;text-shadow:0 2px 5px #000;font-size:20px}.info{padding:9px}.info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:15px 0}.toolbar select{background:#222;color:#fff;border:1px solid #444;padding:9px;border-radius:4px}.status{margin:15px 0;padding:12px 14px;border-radius:5px;background:#241c14;color:#ffdfa6}.status.err{background:#281317;color:#ffb5b5}.empty,.loading{color:#aaa;padding:22px 0}.profile-screen{text-align:center}.profile-screen h1{font-size:38px}.profiles{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin:25px auto}.profile{width:130px;cursor:pointer;color:#ccc}.avatar{height:112px;border-radius:8px;border:3px solid transparent;background:#333;display:grid;place-items:center;font-size:48px}.profile:hover .avatar{border-color:#fff}.pname{padding:8px}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:16px;z-index:15}.modalbox{background:#171717;border:1px solid #383838;border-radius:8px;padding:22px;width:min(920px,96vw);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modalhead h2{margin:0}.close{background:transparent;font-size:25px;padding:0 8px}.detail-layout{display:grid;grid-template-columns:minmax(140px,230px) 1fr;gap:20px;margin:18px 0}.detail-poster{height:300px;background:#242424 center/cover;border-radius:5px;display:grid;place-items:center;text-align:center}.episode-list{display:grid;gap:8px;margin-top:13px}.episode{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px;background:#222;border-radius:4px}.episode button{white-space:nowrap}.video-wrap{background:#000}.video-wrap video{width:100%;max-height:69vh;display:block;background:#000}.player-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.account-pill{font-size:12px;color:#bbb;max-width:115px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}footer{padding:23px 4%;border-top:1px solid #222;color:#777;font-size:12px;margin-top:18px}@media(max-width:850px){header{height:auto;min-height:64px;flex-wrap:wrap;padding:10px 4%;gap:10px}.nav{order:3;width:100%;overflow:auto}.right{margin-left:auto}.grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:9px}.poster{height:195px}.hero{min-height:290px}.detail-layout{grid-template-columns:120px 1fr}.detail-poster{height:190px}}@media(max-width:510px){.search{width:115px}.right{gap:5px}.right button{padding:8px}.account-pill{display:none}.detail-layout{grid-template-columns:1fr}.detail-poster{height:230px;width:160px}.profile-screen h1{font-size:29px}}
</style><script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script></head><body>
<section id="profileScreen" class="profile-screen hidden"><div><h1>Quem está assistindo?</h1><div id="profiles" class="profiles"></div><div class="toolbar" style="justify-content:center"><button class="outline" onclick="addProfile()">＋ Adicionar perfil</button><button class="outline" onclick="returnToApp()">Voltar ao player</button></div></div></section>
<div id="app" class="hidden"><header><div class="logo" onclick="setPage('inicio')">DARK FLIX</div><nav class="nav"><button data-p="inicio" onclick="setPage('inicio')">Início</button><button data-p="filmes" onclick="setPage('filmes')">Filmes</button><button data-p="series" onclick="setPage('series')">Séries</button><button data-p="canais" onclick="setPage('canais')">Canais</button><button data-p="favoritos" onclick="setPage('favoritos')">Minha lista</button><button data-p="recentes" onclick="setPage('recentes')">Continuar assistindo</button></nav><div class="right"><input id="search" class="search" placeholder="Buscar títulos" oninput="render()"><span id="accountPill" class="account-pill"></span><button class="outline" title="Perfis" onclick="showProfiles()">👤</button><button class="outline" title="Conta" onclick="openSettings()">⚙</button><button class="outline" onclick="disconnect()">Sair</button></div></header><main id="main"></main><footer>Web player conectado ao catálogo do seu provedor. Perfis, favoritos e histórico ficam salvos localmente neste navegador.</footer></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div id="modalContent" class="modalbox"></div></div>
<script>
const PROFILE_KEY='darkflix_profiles_v2',FAV_KEY='darkflix_favorites_v2',RECENT_KEY='darkflix_recent_v2';let profile=null,items=[],categories={filmes:[],series:[],canais:[]},page='inicio',selectedCategory='all',hls=null,loadSeq=0,seriesEpisodeCache={};const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function read(key,def){try{return JSON.parse(localStorage.getItem(key))??def}catch{return def}}function write(key,val){localStorage.setItem(key,JSON.stringify(val))}
async function api(action,extra={}){const r=await fetch('/api/xtream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});const j=await r.json();if(!r.ok)throw Error(j.error||'Falha ao consultar o provedor.');return j.data}
function getProfiles(){return read(PROFILE_KEY,[])}function showProfiles(){$('app').classList.add('hidden');$('profileScreen').classList.remove('hidden');let ps=getProfiles();if(!ps.length){ps=[{id:'p'+Date.now(),name:'Principal',avatar:'👤'}];write(PROFILE_KEY,ps)}$('profiles').innerHTML=ps.map(p=>`<div class="profile" onclick="selectProfile('${esc(p.id)}')"><div class="avatar">${esc(p.avatar||'👤')}</div><div class="pname">${esc(p.name)}</div><button class="outline" onclick="event.stopPropagation();removeProfile('${esc(p.id)}')">Editar/remover</button></div>`).join('')}function selectProfile(id){profile=getProfiles().find(p=>p.id===id);if(!profile)return;$('profileScreen').classList.add('hidden');$('app').classList.remove('hidden');$('accountPill').textContent=profile.name;setPage('inicio');loadCatalog()}function addProfile(){let ps=getProfiles();if(ps.length>=6)return alert('Limite de 6 perfis locais atingido.');let name=prompt('Nome do novo perfil:');if(name?.trim()){ps.push({id:'p'+Date.now(),name:name.trim(),avatar:['👤','🎬','⭐','🐼','🦊'][ps.length%5]});write(PROFILE_KEY,ps);showProfiles()}}function removeProfile(id){let ps=getProfiles(),p=ps.find(x=>x.id===id);if(!p)return;const name=prompt('Digite um novo nome para editar o perfil, ou deixe vazio para remover:',p.name);if(name===null)return;if(name.trim())p.name=name.trim();else{if(ps.length<=1)return alert('Mantenha pelo menos um perfil.');ps=ps.filter(x=>x.id!==id)}write(PROFILE_KEY,ps);showProfiles()}
async function loadCatalog(){const seq=++loadSeq;items=[];categories={filmes:[],series:[],canais:[]};$('main').innerHTML='<div class="wrap loading">Carregando catálogo do provedor…</div>';try{const actions=['get_vod_streams','get_series','get_live_streams','get_vod_categories','get_series_categories','get_live_categories'];const d=await Promise.all(actions.map(a=>api(a)));if(seq!==loadSeq)return;items=[...normalize(d[0],'filmes'),...normalize(d[1],'series'),...normalize(d[2],'canais')];categories={filmes:Array.isArray(d[3])?d[3]:[],series:Array.isArray(d[4])?d[4]:[],canais:Array.isArray(d[5])?d[5]:[]};render()}catch(e){if(seq===loadSeq)showStatus(e.message+' Confirme endereço, credenciais e disponibilidade do servidor.','err')}}function normalize(list,type){return Array.isArray(list)?list.map(o=>({id:String(o.stream_id??o.series_id),name:o.name||o.title||'Sem título',type,year:o.year||o.releaseDate||'',genre:o.category_name||o.genre||'',categoryId:String(o.category_id??''),cover:o.stream_icon||o.cover||'',streamId:o.stream_id??o.series_id,ext:o.container_extension||(type==='canais'?'ts':'mp4'),plot:o.plot||'',rating:o.rating||''})).filter(o=>/^\d{1,20}$/.test(o.id)):[]}
function setPage(p){page=p;selectedCategory='all';$('search').value='';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('sel',b.dataset.p===p));render()}function pageType(){return({filmes:'filmes',series:'series',canais:'canais'})[page]}function render(){if($('app').classList.contains('hidden'))return;let q=$('search').value.trim().toLowerCase(),type=pageType();let list=items.filter(x=>{const match=!q||x.name.toLowerCase().includes(q)||String(x.genre).toLowerCase().includes(q);const typed=!type||x.type===type;const category=selectedCategory==='all'||x.categoryId===selectedCategory;const localList=page==='favoritos'?isFavorite(x):page==='recentes'?isRecent(x):true;return match&&typed&&category&&localList});let hero=page==='inicio'?`<section class="hero"><div><h1>Seu entretenimento.<br>Do seu jeito.</h1><p>Filmes, séries e canais carregados diretamente da sua conta. Escolha um título para ver detalhes e reproduzir.</p><button class="red" onclick="setPage('filmes')">▶ Explorar filmes</button> <button class="outline" onclick="setPage('canais')">Ver canais ao vivo</button></div></section>`:'';let title={inicio:'Catálogo',filmes:'Filmes',series:'Séries',canais:'Canais ao vivo',favoritos:'Minha lista',recentes:'Continuar assistindo'}[page];let tools=type?`<div class="toolbar"><label>Categoria <select id="categoryFilter" onchange="selectedCategory=this.value;render()"><option value="all">Todas</option>${categories[type].map(c=>`<option value="${esc(c.category_id)}" ${String(c.category_id)===selectedCategory?'selected':''}>${esc(c.category_name)}</option>`).join('')}</select></label><span class="muted">${list.length} título(s)</span></div>`:'';$('main').innerHTML=hero+`<div class="wrap"><h2 class="section-title">${title}</h2>${tools}<div class="grid">${list.map(card).join('')||'<p class="empty">Nenhum título nesta lista/categoria.</p>'}</div></div>`}function card(x){return `<article class="card" onclick="details('${esc(x.id)}')"><div class="poster" style="${x.cover?`background-image:linear-gradient(0deg,#0008,transparent 60%),url('${esc(x.cover)}')`:''}"><i class="badge">${x.type==='canais'?'AO VIVO':x.type==='series'?'SÉRIE':'FILME'}</i>${isFavorite(x)?'<span class="favorite-mark">♥</span>':''}${x.cover?'':`<b>${esc(x.name)}</b>`}</div><div class="info"><strong>${esc(x.name)}</strong><span class="muted">${esc(x.genre)}${x.year?' · '+esc(x.year):''}</span></div></article>`}
function favKey(x){return`${profile.id}:${x.type}:${x.id}`}function isFavorite(x){return read(FAV_KEY,[]).includes(favKey(x))}function isRecent(x){return read(RECENT_KEY,[]).some(a=>a.profile===profile.id&&a.key===`${x.type}:${x.id}`)}function toggleFavorite(id){let x=items.find(a=>a.id===id);if(!x)return;let f=read(FAV_KEY,[]),k=favKey(x);write(FAV_KEY,f.includes(k)?f.filter(a=>a!==k):[...f,k]);details(id)}function addRecent(item){let r=read(RECENT_KEY,[]),key=`${item.type}:${item.id}`;r=r.filter(a=>!(a.profile===profile.id&&a.key===key));r.unshift({profile:profile.id,key,id:item.id,type:item.type,date:Date.now()});write(RECENT_KEY,r.slice(0,100))}
async function details(id){const x=items.find(a=>a.id===id);if(!x)return;open(`<div class="modalhead"><h2>${esc(x.name)}</h2><button class="close" onclick="closeModal()">×</button></div><div id="detailBody" class="loading">Carregando detalhes…</div>`);let extra={};try{if(x.type==='filmes')extra=await api('get_vod_info',{vod_id:x.id});else if(x.type==='series')extra=await api('get_series_info',{series_id:x.id})}catch(e){extra={_error:e.message}}if($('modal').classList.contains('hidden'))return;const data=extra.info||extra.movie_data||extra;let plot=x.plot||data.plot||data.description||'',cast=data.cast||'',director=data.director||'',released=data.releasedate||x.year,rating=data.rating||x.rating,poster=data.movie_image||data.cover||x.cover;$('detailBody').outerHTML=`<div class="detail-layout"><div class="detail-poster" style="${poster?`background-image:url('${esc(poster)}')`:''}">${poster?'':esc(x.name)}</div><div><div class="muted">${esc(x.type)} ${released?' · '+esc(released):''} ${rating?' · ★ '+esc(rating):''}</div><p>${esc(plot||'Sem sinopse disponível no provedor.')}</p>${director?`<p class="muted">Direção: ${esc(director)}</p>`:''}${cast?`<p class="muted">Elenco: ${esc(cast)}</p>`:''}<div class="toolbar"><button class="red" onclick="${x.type==='series'?`showEpisodes('${esc(x.id)}')`:`playItem('${esc(x.id)}')`}">${x.type==='series'?'▶ Ver episódios':'▶ Reproduzir'}</button><button onclick="toggleFavorite('${esc(x.id)}')">${isFavorite(x)?'♥ Remover dos favoritos':'＋ Minha lista'}</button></div><div id="episodeArea"></div>${extra._error?`<p class="muted">${esc(extra._error)}</p>`:''}</div></div>`}
async function showEpisodes(id){$('episodeArea').innerHTML='<div class="loading">Carregando temporadas e episódios…</div>';try{const d=await api('get_series_info',{series_id:id});const eps=d.episodes||{};let keys=Object.keys(eps);if(!keys.length)throw Error('O provedor não retornou episódios para esta série.');seriesEpisodeCache[id]=eps;let opts=keys.map(k=>`<option value="${esc(k)}">Temporada ${esc(k)}</option>`).join('');$('episodeArea').innerHTML=`<label class="field">Temporada<select id="seasonSelect" onchange="renderEpisodes('${esc(id)}')">${opts}</select></label><div id="episodeList"></div>`;renderEpisodes(id)}catch(e){$('episodeArea').innerHTML=`<div class="status err">${esc(e.message)}</div>`}}function renderEpisodes(id){const eps=seriesEpisodeCache[id]||{},key=$('seasonSelect')?.value||Object.keys(eps)[0],arr=eps[key]||[];$('episodeList').innerHTML=arr.map((ep,i)=>`<div class="episode"><span><b>${esc(ep.title||ep.name||'Episódio '+(i+1))}</b><br><span class="muted">${esc(ep.info?.plot||ep.plot||'')}</span></span><button class="red" onclick="playEpisode('${esc(id)}','${/^\d{1,20}$/.test(String(ep.id||ep.stream_id))?String(ep.id||ep.stream_id):''}','${/^[a-zA-Z0-9]{1,10}$/.test(String(ep.container_extension||'mp4'))?String(ep.container_extension||'mp4'):'mp4'}')">▶</button></div>`).join('')||'<p class="empty">Nenhum episódio nesta temporada.</p>'}
function playItem(id){const x=items.find(a=>a.id===id);if(!x)return;addRecent(x);const kind=x.type==='filmes'?'movie':'live',original=x.ext||(kind==='live'?'ts':'mp4'),formats=kind==='live'?['m3u8','ts','mp4']:[original,'m3u8','mp4'];showPlayer(x.name,{kind,id:String(x.streamId),ext:formats[0]},formats)}function playEpisode(seriesId,episodeId,ext){if(!/^\d{1,20}$/.test(String(episodeId)))return alert('ID de episódio inválido.');const x=items.find(a=>a.id===seriesId);if(x)addRecent(x);const formats=[ext||'mp4','m3u8','mp4'].filter((v,i,a)=>a.indexOf(v)===i);showPlayer('Reproduzindo episódio',{kind:'series',id:String(episodeId),ext:formats[0]},formats)}
let playerVariants=[],activeSpec=null,activeMediaExt='';function showPlayer(title,spec,formats){activeSpec=spec;playerVariants=formats.map(ext=>({...spec,ext}));open(`<div class="modalhead"><h2>${esc(title)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="video-wrap"><video id="player" controls autoplay playsinline></video></div><div id="playerMsg" class="muted" style="margin-top:8px">Preparando stream pelo proxy seguro…</div><div class="player-actions"><select id="playerVariant" onchange="startPlayer(this.value)" style="background:#222;color:white;border:1px solid #555;padding:9px;border-radius:4px">${playerVariants.map((v,i)=>`<option value="${i}">${i===0?'Formato preferido':v.ext.toUpperCase()}</option>`).join('')}</select><button class="outline" onclick="toggleFullscreen()">Tela cheia</button><button class="outline" onclick="retryPlayer()">Tentar novamente</button></div>`);startPlayer('0')}async function startPlayer(input){const spec=playerVariants[Number(input)]||playerVariants[0],v=$('player');if(!v||!spec)return;if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load();$('playerMsg').textContent='Conectando ao servidor de mídia pelo proxy Vercel…';activeMediaExt=spec.ext;try{const r=await fetch('/api/stream-ticket',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(spec)});const data=await r.json();if(!r.ok)throw Error(data.error||'Falha ao preparar stream.');const url=data.url;if(spec.ext.toLowerCase()==='m3u8'){if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=url;v.play().catch(()=>{})}else if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:true});hls.loadSource(url);hls.attachMedia(v);hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)$('playerMsg').textContent='Erro HLS no proxy: '+(d.details||'playlist/segmento indisponível')});hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}))}else throw Error('Este navegador não tem suporte a HLS.')}else{v.src=url;v.play().catch(()=>{$('playerMsg').textContent='Stream conectado. Pressione reproduzir.'})}v.onerror=async()=>{try{const check=await fetch(url,{method:'HEAD'});const hint=check.headers.get('X-Stream-Error');$('playerMsg').textContent=hint||'O proxy respondeu, mas o navegador não conseguiu decodificar o formato. Tente outra variante ou verifique o codec.'}catch{$('playerMsg').textContent='Não foi possível alcançar o proxy de mídia. Verifique o domínio Vercel e a configuração das funções.'}};$('playerMsg').textContent='Stream solicitado pela conexão segura da Vercel.'}catch(e){$('playerMsg').textContent=e.message;console.error('Falha no proxy de mídia:',e)}}function retryPlayer(){const sel=$('playerVariant');if(sel)startPlayer(sel.value)}function toggleFullscreen(){const v=$('player');if(!v)return;if(document.fullscreenElement)document.exitFullscreen();else if(v.requestFullscreen)v.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()}
function open(html){$('modalContent').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){if(hls){hls.destroy();hls=null}const v=$('player');if(v){v.pause();v.removeAttribute('src');v.load()}$('modal').classList.add('hidden');$('modalContent').innerHTML=''}function showStatus(t,c){$('main').innerHTML=`<div class="wrap"><div class="status ${c||''}">${esc(t)}</div><button class="outline" onclick="loadCatalog()">Atualizar catálogo</button></div>`}function openSettings(){open(`<div class="modalhead"><h2>Player</h2><button class="close" onclick="closeModal()">×</button></div><p>O catálogo usa a conexão privada configurada no projeto Vercel. As credenciais não são enviadas ao navegador.</p><p>Perfil neste dispositivo: <b>${esc(profile?.name||'Principal')}</b>.</p><div class="toolbar"><button class="red" onclick="closeModal();loadCatalog()">Atualizar catálogo</button><button class="outline" onclick="closeModal();showProfiles()">Gerenciar perfis locais</button></div>`)}function returnToApp(){$('profileScreen').classList.add('hidden');$('app').classList.remove('hidden');if(!items.length)loadCatalog()}(function boot(){let ps=getProfiles();if(!ps.length){ps=[{id:'p'+Date.now(),name:'Principal',avatar:'👤'}];write(PROFILE_KEY,ps)}profile=ps[0];$('accountPill').textContent=profile.name;$('profileScreen').classList.add('hidden');$('app').classList.remove('hidden');setPage('inicio');loadCatalog()})();
</script></body></html>
